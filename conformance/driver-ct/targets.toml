version = "0.1"

[features.sha1-checked]
kind = "gated"
[features.ecdsa-sign]
kind = "structural"

[targets.wasmtime-rustcrypto]
missing-features = []

[targets.composed]
# The shared suite plugged with the in-guest RustCrypto provider
# (rust/guest-provider), run under the generic component-test host
# runner. The provider serves every gated feature the shared suite
# exercises (sha1-checked); its one deliberate gap is `ecdsa-sign`
# (class D — see rust/guest-provider/README.md), which nothing in this
# suite is tagged with (the exclusion is structural: the signing suite's
# world imports the interface, so it cannot even link composed —
# `just class-d` asserts the absent export, so this line cannot outlive
# the fact it records).
missing-features = ["ecdsa-sign"]

[targets.jco-node]
missing-features = ["sha1-checked"]

[targets.jco-browser]
# The same host module as jco-node, in headless Chromium. Like jco-node it
# cannot serve `sha1-checked`. The browser also fails the gated RSA
# private-key mints closed (see targets-signing.toml; nothing in this
# suite is tagged with them).
missing-features = ["sha1-checked"]
# Gates in CI (the Actions runner ships Chrome); locally it needs a
# Chrome/Chromium install and runs only when opted in with
# CONFORMANCE_BROWSER=1, so missing results files are warnings, not errors.
optional = true

[targets.deltic-deno]
# The same reference host as jco-node/jco-browser in behavior, rewritten
# over deltic's embedder API (js/deltic/src/mod.ts), run RUNTIME-LINKED
# under stock Deno — no transpile step, no generated tree. Like every
# platform-WebCrypto-backed target it cannot serve `sha1-checked` (no
# platform carries sha1dc), and the suite's `!sha1-checked` decline case
# verifies the refusal.
missing-features = ["sha1-checked"]
# Deno's WebCrypto is narrower than Node's and the browsers' in three
# parameter windows the WIT admits (AES-GCM tag/IV lengths, AES-CTR
# counter width) plus one OAEP label encoding; those cases are declared
# below as expected failures — tracked debt, not silent tolerance, and
# the aggregate fails on any UNdeclared failure or any declaration that
# has gone stale.
[[targets.deltic-deno.expected-fail]]
case = "probe/gcm-full-parameters"
reason = "Deno WebCrypto: AES-GCM decrypt refuses tags shorter than 128 bits"
tracking = "https://github.com/polymorph-components/polymorph-webcrypto/issues/351"

[[targets.deltic-deno.expected-fail]]
case = "probe/gcm-nonce-window"
reason = "Deno WebCrypto: AES-GCM IV window is 96/128 bits (WIT window 12-128 bytes)"
tracking = "https://github.com/polymorph-components/polymorph-webcrypto/issues/351"

[[targets.deltic-deno.expected-fail]]
case = "probe/ctr-known-answers"
reason = "Deno WebCrypto: AES-CTR counter width limited to 32/64/128 bits (WIT window 1-128)"
tracking = "https://github.com/polymorph-components/polymorph-webcrypto/issues/351"

[[targets.deltic-deno.expected-fail]]
case = "aes-gcm/wycheproof/tc259/whole"
reason = "Deno WebCrypto: AES-GCM IV window is 96/128 bits; this case uses 120"
tracking = "https://github.com/polymorph-components/polymorph-webcrypto/issues/351"

[[targets.deltic-deno.expected-fail]]
case = "aes-gcm/wycheproof/tc259/bytes"
reason = "Deno WebCrypto: AES-GCM IV window is 96/128 bits; this case uses 120"
