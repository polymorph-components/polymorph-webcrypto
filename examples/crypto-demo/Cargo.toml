[package]
name = "crypto-demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# The checks whose imports the in-guest provider withholds (class D):
# the RSA-OAEP key transport and the ECDSA signing-key mints. Off by
# default, exactly like the SDK feature and WIT gate behind the RSA
# half: enabling it adds withheld interfaces to the component's imports,
# which only hosts that deliberately serve them can satisfy — the
# default build is what stays composable. The wasmtime and jco demo legs
# run the opt-in artifact, named after the conformance architecture's
# host-only suite.
host-only = ["polymorph-webcrypto-guest/rsa-oaep-decrypt"]

[dependencies]
# Failure reporting inside the checks (`context`/`ensure!`); rendered with
# `{:#}` at the WIT `result<string, string>` boundary.
anyhow = "1"
# `async` pulls in the component-model `stream`/`future` runtime support and
# the `wit_stream` helpers used to feed byte streams to the imports.
wit-bindgen = { version = "0.59", features = ["async"] }
# The polymorph:webcrypto bindings and byte-buffer helpers; carries the imports,
# so this component's own world declares only its export. Both optional
# source adaptors are enabled: the demo is the wrapper layer's execution
# harness, and these features' feed loops run nowhere else. `sha1-checked`
# adds the gated checked-SHA-1 imports, whose wrappers the demo also
# executes (implementations may decline the constructors — the demo's
# check accepts the documented fail-closed posture).
polymorph-webcrypto-guest = { path = "../../rust/guest", features = ["bytes", "futures-io", "sha1-checked"] }
# `join!` lets the component feed a stream and await the consuming import
# concurrently within a single cooperative task (no OS threads).
futures = { version = "0.3", default-features = false, features = ["async-await"] }
# Buf inputs for the `DataSource::from_buf` checks.
bytes = "1"
# The `AsyncRead` trait for the `DataSource::from_reader` checks.
futures-io = "0.3"
# Decodes the known-answer vectors to byte arrays at compile time.
data-encoding-macro = "0.1"
# Renders bytes as hex in the checks' failure messages.
data-encoding = "2"
