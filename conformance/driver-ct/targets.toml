[targets.jco-webkit]
# The same host module in Playwright WebKit on macOS — Apple's crypto
# backend, the closest CI proxy for Safari (the Linux port's backend
# serves less and represents no shipping Safari; run-browser.mjs refuses
# it). Like every platform-WebCrypto-backed target it cannot serve
# `sha1-checked`, and like the other browsers it fails the gated RSA
# private-key mints closed (targets-signing.toml). Like Deno, the
# platform refuses imported 8192-bit RSA public keys, so the whole
# 8192 row is the gated `rsa-verify-8192` capability gap, proved by its
# decline case rather than ledgered case by case.
missing-features = ["sha1-checked", "rsa-verify-8192"]
# Runs as the dedicated macOS CI job (conformance-webkit); its results
# reach the aggregate in the conformance-aggregate job and local
# checkouts via the CI artifact flow, so missing results files are
# warnings, not errors.
optional = true
# The Apple-platform strictness and laxness windows below are declared
# expected failures (tracked debt, #360), mirroring the deltic-deno and
# jco-firefox ledgers: unreduced RSASSA signatures accepted, the Ed25519
# empty message rejected, non-deterministic Ed25519 signing, and
# malformed AES-CBC ciphertexts accepted.

