wit = ["aes-ctr"]
select = ["shared:aes-ctr/", "shared:probe/ctr-known-answers"]

[[rows.aspects]]
id = "counter-widths"
label = "Counter widths other than 32/64/128 bits (WIT window: 1–128)"
note = """
AesCtrParams.length — how many low-order bits of the counter block
increment — is specified for 1 through 128, over NIST SP 800-38A's standard
incrementing function. Deno serves only 32-, 64- and 128-bit widths, and
Firefox refuses very narrow counters (a 2-bit width fails with
OperationError).
"""
select = ["shared:probe/ctr-known-answers"]

