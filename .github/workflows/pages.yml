name: pages

# Publish the Pages site: the browser WPT parity page
# (js/componentize/wpt/web/), the conformance results viewer and compat
# matrix, and the public crates' API docs. Builds the WPT page's
# artifacts and the rustdoc, then deploys the site assembled by
# `just gha::pages-site`.
# The pages' URLs are all relative, so they serve correctly from the
# project subpath.
#
# Triggered by CI COMPLETING on main, not by the push: the site stages
# the conformance-results artifact (results, matrices, compat.json), and
# a push-triggered build races the CI run producing it — it would always
# publish the previous run's data against the new commit's page code.
# The build checks out the triggering run's commit and downloads that
# exact run's artifact, so page code and data are always same-commit.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One deployment at a time; a newer run supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # A failed CI run publishes nothing (its artifact may be partial);
    # manual dispatch builds from whatever the branch and the latest
    # successful run provide.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true
          # The CI workflow owns this cache; this job only reads it.
          save-if: false

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install Deno
        # For the viewer staging's deltic release assets
        # (conformance-ct::_viewer-prepared runs the checkout's
        # fetch-deltic.ts). Version-pinned as in ci.yml.
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the WPT parity page artifacts
        run: just wpt::web-artifacts

      - name: Build the conformance viewer artifacts
        # component-test's results viewer staged at the pin: the page
        # files, the raw viewer-aggregate component (deltic translates
        # it in-page — no transpile), and the pinned deltic release
        # assets.
        run: just conformance-ct::_viewer-prepared

      - name: Fetch the conformance results (best effort)
        # The viewer's and compat page's data: the conformance-results
        # artifact of the CI run this build follows (workflow_run), or
        # the newest successful main run under manual dispatch. Absent
        # (expired retention, API hiccup), the page still serves — the
        # file inputs are self-contained.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ github.event.workflow_run.id }}"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" -q '.workflow_runs[0].id' || true)
          fi
          if [ -n "$run_id" ]; then
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n conformance-results \
              -D conformance/driver-ct/results/ \
              && echo "staged results from CI run $run_id" \
              || echo "no conformance-results artifact on run $run_id; publishing without results"
          else
            echo "no successful CI run found; publishing without results"
          fi

      - name: Assemble the static site
        run: just gha::pages-site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/conformance-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
