# ── Feature gates ────────────────────────────────────────────────────
# The rationale sections the page links from every cell reporting a
# gated feature. Internal tracking stays in targets.toml's ledgers.

[[features]]
id = "sha1-checked"
note = """
The interface serves SHA-1 with collision detection: the sha1dc
construction detects inputs exercising the known SHA-1 collision
attacks and reports them instead of returning a plain digest — the
hardening git adopted after the SHAttered collision. Platform WebCrypto
exposes only plain SHA-1, so every platform-backed host declares the
feature missing; the Rust implementations serve it.
"""
[[features.links]]
label = "sha1collisiondetection (Stevens, Karpman)"
url = "https://github.com/cr-marcstevens/sha1collisiondetection"
[[features.links]]
label = "SHAttered: the first SHA-1 collision"
url = "https://shattered.io/"

[[features]]
id = "rsa-sign"
note = """
RSA private-key operations leak through timing, and a browser is an
attacker-observable timing domain — Kocher's original timing attack
recovered RSA private keys, and the Marvin attack demonstrated the
class is alive across modern implementations. The browser hosts
therefore fail the gated RSASSA-PKCS1-v1_5 and RSA-PSS signing mints
closed by default, with an explicit deployer opt-in; Node and Deno
serve them by default.
"""
[[features.links]]
label = "Kocher, Timing Attacks on Implementations of Diffie-Hellman, RSA, DSS (1996)"
url = "https://paulkocher.com/doc/TimingAttacks.pdf"
[[features.links]]
label = "The Marvin Attack (Red Hat)"
url = "https://people.redhat.com/~hkario/marvin/"

[[features]]
id = "rsa-oaep-decrypt"
note = """
RSA decryption in an attacker-observable timing domain is a decryption
oracle: Manger's chosen-ciphertext attack recovers OAEP plaintexts from
a decoder that leaks where it fails, and the Marvin attack demonstrated
practical RSA decryption timing oracles across modern stacks. The
browser hosts therefore fail the gated RSA-OAEP decryption mints closed
by default, with an explicit deployer opt-in; Node and Deno serve them
by default.
"""
[[features.links]]
label = "The Marvin Attack (Red Hat)"
url = "https://people.redhat.com/~hkario/marvin/"
[[features.links]]
label = "RFC 8017, §7.1.2 (RSAES-OAEP decryption)"
url = "https://www.rfc-editor.org/rfc/rfc8017#section-7.1.2"

[[features]]
id = "rsa-verify-8192"
note = """
A platform capability gap, not a policy: Deno and WebKit (macOS) refuse
to import 8192-bit RSA public keys in every format while serving
smaller moduli, and Deno generates 8192-bit keys it cannot re-import.
RFC 8017 places no bound on the modulus; the affected hosts declare the
capability missing rather than work around the platform importer.
"""
[[features.links]]
label = "RFC 8017 (PKCS #1 v2.2)"
url = "https://www.rfc-editor.org/rfc/rfc8017"
