select = ["shared:aes-cbc/", "shared:probe/cbc-uniform-failure"]

[[rows.aspects]]
id = "malformed-ciphertexts"
label = "Malformed ciphertexts rejected (empty input)"
note = """
Web Cryptography's AES-CBC decrypts then unpads per PKCS #7, so a valid
ciphertext is a nonzero multiple of 16 bytes and the empty ciphertext must
fail. WebKit's decrypt accepts the empty ciphertext (Wycheproof's
upstream-invalid NoPadding vectors) instead of failing the padding check.
"""
select = ["shared:probe/cbc-uniform-failure"]
cases = [
    "shared:aes-cbc/wycheproof/tc25/whole",
    "shared:aes-cbc/wycheproof/tc169/whole",
]

[[rows.aspects.links]]
label = "Web Cryptography API, AES-CBC"
url = "https://www.w3.org/TR/WebCryptoAPI/#aes-cbc"

[[rows.aspects.links]]
