    "shared:probe/signing-usage-policy",
]

[[rows.aspects]]
id = "deterministic-signatures"
label = "Deterministic RFC 8032 signatures"
note = """
Ed25519 signing is deterministic: RFC 8032 §5.1.6 derives the nonce from
the private key and the message, so a (key, message) pair has exactly one
signature and the RFC's vectors pin sign output byte for byte. WebKit
returns a different signature than the RFC 8032 TEST 3 known answer for a
PKCS#8-imported key — randomized signing or a key-decode divergence; its
own verify accepts the output.
"""
select = ["shared:probe/ed25519-private-format-imports"]

[[rows.aspects.links]]
label = "RFC 8032, §5.1.6 (sign)"
url = "https://www.rfc-editor.org/rfc/rfc8032#section-5.1.6"

