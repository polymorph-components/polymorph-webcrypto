[[rows.aspects]]
id = "iv-window"
label = "IVs other than 96/128 bits (WIT window: 12–128 bytes)"
note = """
Web Cryptography's AES-GCM takes any nonzero-length IV — the operation is
defined over NIST SP 800-38D, which admits IVs from 1 to 2^64-1 bits — and
this package narrows the window to 12–128 bytes. Deno's implementation
serves only 96- and 128-bit IVs and rejects the rest of the window.
"""
select = [
    "shared:probe/gcm-nonce-window",
    "shared:aes-gcm/wycheproof/tc259/",
    "shared:aes-gcm/wycheproof/tc260/",
    "shared:aes-gcm/wycheproof/tc263/",
    "shared:aes-gcm/wycheproof/tc264/",
    "shared:aes-gcm/wycheproof/tc265/",
    "shared:aes-gcm/wycheproof/tc266/",
    "shared:aes-gcm/wycheproof/tc267/",
    "shared:aes-gcm/wycheproof/tc273/",
    "shared:aes-gcm/wycheproof/tc274/",
    "shared:aes-gcm/wycheproof/tc275/",
]

[[rows.aspects.links]]
label = "Web Cryptography API, AES-GCM"
url = "https://www.w3.org/TR/WebCryptoAPI/#aes-gcm"

[[rows.aspects.links]]
label = "NIST SP 800-38D (GCM)"
url = "https://csrc.nist.gov/pubs/sp/800/38/d/final"

[[rows.aspects]]
id = "tag-window"
label = "Decryption tags shorter than 128 bits (WIT window: 32–128, multiples of 8)"
note = """
Web Cryptography's AesGcmParams admits tag lengths of 32, 64, 96, 104, 112,
120 and 128 bits; NIST SP 800-38D's appendices bound the forgery risk of
truncated tags. Deno's implementation refuses to open a message whose tag
is shorter than 128 bits.
"""
select = ["shared:probe/gcm-full-parameters"]

