[[rows.aspects]]
id = "public-key-admission"
label = "Low-order / non-canonical public keys accepted at import"
note = """
RFC 7748 defines X25519 over any 32-byte u-coordinate: decoding masks the
high bit, low-order inputs yield the all-zero shared secret, and §6.1 leaves
checking that output to the protocol (MAY). Firefox/NSS takes the strict
posture and rejects low-order and non-canonical public keys at import —
the same contributory-behavior stance libsodium documents — where other
platforms import them and let the derivation produce its defined result.
"""
