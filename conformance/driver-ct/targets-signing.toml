# The host-only signing suite: the host-backed targets (wasmtime,
# jco-node, jco-browser) — the composed target cannot even link its world (ecdsa-sign
# is class D). ecdsa-sign is
# structural and untagged; the gated RSA features (rsa-sign,
# rsa-oaep-decrypt) tag the suite's RSA vector cases and probes, with a
# !feature decline case each proving the refusal on targets declaring
# them missing.
version = "0.1"

[features.ecdsa-sign]
kind = "structural"

[features.rsa-sign]
kind = "gated"

[features.rsa-oaep-decrypt]
kind = "gated"

[targets.wasmtime-rustcrypto]
missing-features = []

[targets.jco-node]
# Node's WebCrypto serves the gated RSA private-key mints by default —
# the fail-closed rsa-sign/rsa-oaep-decrypt posture is a browser policy
# (jco-browser), not Node's.
missing-features = []

[targets.jco-browser]
# The same host module as jco-node, in headless Chromium. The host
# declines the gated RSA private-key mints — the signing interfaces
# (`rsa-sign`) and the RSA-OAEP decryption mints (`rsa-oaep-decrypt`) —
# outside Node by default: a browser is an attacker-observable timing
# domain, so it fails closed unless the deployer opts in with
# `setRsaPrivateKeyPolicy("serve")` — the driver runs the default.
missing-features = ["rsa-sign", "rsa-oaep-decrypt"]
# Gates in CI (the Actions runner ships Chrome); locally it needs a
# Chrome/Chromium install and runs only when opted in with
# CONFORMANCE_BROWSER=1, so missing results files are warnings, not errors.
optional = true

[targets.jco-firefox]
# The same host module in Playwright's pinned Firefox; the same
# fail-closed browser posture on the gated RSA private-key mints as
# jco-browser.
missing-features = ["rsa-sign", "rsa-oaep-decrypt"]
# Gates in CI (the conformance job installs Playwright Firefox); locally
# opt in with CONFORMANCE_FIREFOX=1, so missing results files are
# warnings.
optional = true

[targets.jco-webkit]
# The same host module in Playwright WebKit on macOS (see targets.toml);
# the same fail-closed browser posture on the gated RSA private-key
# mints as jco-browser.
missing-features = ["rsa-sign", "rsa-oaep-decrypt"]
# Runs as the dedicated macOS CI job; missing results files are
# warnings, not errors.
optional = true

[targets.deltic-deno]
# Deno's WebCrypto serves the gated RSA private-key mints by default, so
# the deltic host module takes the same posture as jco-node — the
# fail-closed rsa-sign/rsa-oaep-decrypt policy is a browser posture
# (jco-browser), not Deno's; the driver runs the served default.
missing-features = []
