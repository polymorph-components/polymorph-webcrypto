select = ["shared:ed25519/"]

[[rows.aspects]]
id = "empty-message"
label = "Verification of the empty message"
note = """
RFC 8032 defines Ed25519 over messages of any length including the empty
message — its first test vector (TEST 1) signs the empty string — and Web
Cryptography's Ed25519 (the Secure Curves draft) takes the RFC unchanged.
WebKit rejects verification of the empty message where every other platform
verifies it.
"""
cases = [
    "shared:ed25519/wycheproof/tc1/whole",
    "shared:ed25519/wycheproof/tc71/whole",
    "shared:ed25519/wycheproof/tc80/whole",
    "shared:ed25519/wycheproof/tc102/whole",
]

[[rows.aspects.links]]
label = "RFC 8032, §7.1 (test vectors)"
url = "https://www.rfc-editor.org/rfc/rfc8032#section-7.1"

[[rows.aspects.links]]
label = "Secure Curves in the Web Cryptography API"
url = "https://wicg.github.io/webcrypto-secure-curves/"

[[rows]]
id = "rsassa-pkcs1-v15-verify"
group = "signature"
label = "RSASSA-PKCS1-v1_5 verify"
wit = ["rsassa-pkcs1-v15-verify"]
select = ["shared:rsassa-"]

[[rows.aspects]]
id = "unreduced-signatures"
label = "Unreduced (malleable) signatures rejected — s \u2265 n"
note = """
RSASSA-PKCS1-v1_5 verification applies RSAVP1, which rejects any signature
representative outside [0, n-1] (RFC 8017 §5.2.2); s' = s + n is the classic
malleability form. WebKit's verify accepts such unreduced signatures —
Wycheproof's SignatureMalleability vectors — where every other
implementation rejects them.
"""
cases = [
    "shared:rsassa-pkcs1-v15-sha256-2048/wycheproof/tc244/whole",
    "shared:rsassa-pkcs1-v15-sha384-3072/wycheproof/tc245/whole",
    "shared:rsassa-pkcs1-v15-sha256-4096/wycheproof/tc245/whole",
    "shared:rsassa-pkcs1-v15-sha512-4096/wycheproof/tc245/whole",
]

[[rows.aspects.links]]
label = "RFC 8017, §5.2.2 (RSAVP1)"
url = "https://www.rfc-editor.org/rfc/rfc8017#section-5.2.2"

[[rows.aspects.links]]
label = "Project Wycheproof"
url = "https://github.com/C2SP/wycheproof"

[[rows.aspects]]
id = "verify-8192"
label = "Imported 8192-bit public keys"
note = """
RFC 8017 places no upper bound on the RSA modulus, and Web Cryptography's
import steps defer to the implementation. Deno and WebKit (macOS) refuse to
import 8192-bit public keys in every format while serving smaller moduli —
an implementation ceiling, not a policy; Deno even generates 8192-bit keys
it cannot re-import. The hosts declare the capability missing (the
rsa-verify-8192 gate) rather than work around the platform importer.
"""
select = ["shared:rsassa-pkcs1-v15-sha256-8192/"]

[[rows.aspects.links]]
label = "RFC 8017 (PKCS #1 v2.2)"
url = "https://www.rfc-editor.org/rfc/rfc8017"

[[rows.aspects.links]]
label = "Web Cryptography API, RSASSA-PKCS1-v1_5"
url = "https://www.w3.org/TR/WebCryptoAPI/#rsassa-pkcs1"

