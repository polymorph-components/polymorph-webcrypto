# The compat matrix's curated structure: display order, row/group
# labels, case ownership, and the NAMES of divergences (aspects). Which
# cells are green is always computed from results — see README.md in
# this directory for the schema and the fail-closed validation the
# `compat` binary applies (total ownership, per-cell uniformity, aspect
# liveness, ledger agreement).
version = "0.1"

# ── Columns ──────────────────────────────────────────────────────────
# The five platform-backed hosts first, then the two Rust
# implementations of this repository.

[[columns]]
target = "jco-browser"
label = "Chromium"
kind = "host"

[[columns]]
target = "jco-firefox"
label = "Firefox"
kind = "host"

[[columns]]
target = "jco-webkit"
label = "WebKit (macOS)"
kind = "host"

[[columns]]
target = "jco-node"
label = "Node.js"
kind = "host"

[[columns]]
target = "deltic-deno"
label = "Deno"
kind = "host"

[[columns]]
target = "wasmtime-rustcrypto"
label = "Wasmtime (RustCrypto)"
kind = "implementation"

[[columns]]
target = "composed"
label = "In-guest provider"
kind = "implementation"

# ── Groups: the WIT generic kinds, then the cross-cutting contracts ──

[[groups]]
id = "mac"
label = "message authentication"

[[groups]]
id = "aead"
label = "authenticated encryption with associated data"

[[groups]]
id = "cipher"
label = "unauthenticated encryption (compatibility)"

[[groups]]
id = "key-wrap"
label = "dedicated key wrapping"

[[groups]]
id = "digest"
label = "cryptographic digests"

[[groups]]
id = "signature"
label = "signatures"

[[groups]]
id = "key-agreement"
label = "key agreement"

[[groups]]
id = "derivation"
label = "key and bit derivation"

[[groups]]
id = "public-encryption"
label = "public-key encryption"

[[groups]]
id = "contracts"
label = "package contracts (kind-generic and cross-cutting)"

