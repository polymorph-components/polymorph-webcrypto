name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Native Rust checks: formatting, lints, WIT validation, the
  # guest-under-Wasmtime integration test, and the composed demo.
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # The toolchain version, wasm target, and rustfmt/clippy components are
        # pinned in rust-toolchain.toml; `rustup show` installs exactly those.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-checks
          cache-all-crates: true

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_NODE: "1"

      # The whole job body lives in the justfile (`rust-checks`): formatting,
      # WIT validation, clippy, Rust tests (including the guest-under-Wasmtime
      # integration test), and the composed fully in-guest demo. The
      # justfile's `_step` wrapper emits ::group::/::error:: annotations per
      # recipe.
      - name: Run rust checks
        run: just gha::rust-checks

  # The cross-implementation conformance targets that run in this job
  # (component-test stack): both suites across wasmtime-rustcrypto,
  # composed, jco-node, jco-browser (headless Chromium via jco),
  # deltic-browser (headless Chromium via deltic), and deltic-deno
  # (runtime-linked under stock Deno) — plus the aggregates over those
  # targets and the deltic host module's unit gate. The jco-firefox and
  # jco-webkit legs run as their own jobs below (Firefox needs a runner
  # to itself; WebKit needs macOS); the committed-matrix and compat
  # gates run in conformance-aggregate once every target's results
  # exist.
  conformance:
    runs-on: ubuntu-latest
    # Warm runs take a few minutes, but a full cache bootstrap (dependency
    # cache + component-test tools + the artifact cache, all cold) needs
    # ~20; a timeout kill skips the cache-save post steps, so too small a
    # budget here can never bootstrap.
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Restore conformance artifacts
        # The exact products of conformance-ct::build/build-provider (the
        # suite + provider wasms and the ct-driver + compat binaries),
        # keyed on the sources that produce them. rust-cache deliberately
        # excludes workspace-crate artifacts, so without this every run
        # repays the guest builds (rkyv corpus generation) and the
        # wasmtime-embedding driver link (~2 min) even with a warm
        # dependency cache. On a hit the recipes skip cargo entirely
        # (CONFORMANCE_PREBUILT below) and the dependency cache restore is
        # skipped too. Restore/save are split: the save is an explicit
        # step below, not this step's post — see its comment.
        id: ct-artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            target/wasm32-wasip2/release/conformance_guest_ct.wasm
            target/wasm32-wasip2/release/conformance_signing_guest_ct.wasm
            target/wasm32-wasip2/release/polymorph_webcrypto_guest_provider.wasm
            target/release/ct-driver
            target/release/compat
          # Key = enumerated *build inputs* of these artifacts (the crates
          # that produce them, the vectors/harness they embed, the wit,
          # the pins), NOT conformance/** wholesale — prose, committed
          # matrices, lockfiles, target manifests, and the jco driver JS
          # do not invalidate cargo artifacts, and hashing them made
          # doc-only commits repay the full build (#307). Enumerate by
          # inclusion so anything the build newly reads must be added
          # here deliberately; a new build input outside these globs
          # means updating this key.
          key: conformance-artifacts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/**', 'wit/**', 'conformance/vectors/**', 'conformance/harness/**', 'conformance/guest-ct/Cargo.toml', 'conformance/guest-ct/build.rs', 'conformance/guest-ct/src/**', 'conformance/signing-guest-ct/Cargo.toml', 'conformance/signing-guest-ct/src/**', 'conformance/class-d/**', 'conformance/driver-ct/Cargo.toml', 'conformance/driver-ct/src/**') }}

      - name: Cache cargo
        if: steps.ct-artifacts.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          cache-all-crates: true

      - name: Install the component-test tools at the pinned revision
        # Owns the rev derivation, the rev-keyed tools cache, the
        # install, and the pins gate; conformance-ct::_ct-tools
        # recognizes the stamped install and does not repeat it.
        uses: polymorph-components/polymorph-test/actions/setup@b4444a25a22106ad4128549bdc9e579552e62210

      - name: Install Node 24
        # Exact-pinned, like every engine here (Deno, the Playwright
        # builds): Node is the jco-node conformance host and the wpt
        # parity gate's live baseline, and the parity loss set is a
        # per-engine fact — a floating minor turns a Node WebCrypto
        # behavior change into fleet-dependent gate flaps during the
        # runner-image rollout (setup-node's check-latest defaults false,
        # so the toolcache decides). Every node-version in this workflow
        # and pages.yml moves together; a bump reruns
        # `just wpt::update-losses` under the new version in the same PR.
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install Deno
        # For the deltic-deno conformance target and js/deltic's own unit
        # gate: deltic runs the suites RUNTIME-LINKED under stock Deno,
        # its runtime graph pinned by the conformance/driver-ct/deltic and
        # js/deltic import maps + frozen deno.lock files (no npm tree, no
        # transpile). Version-pinned like every other toolchain here.
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Playwright browsers
        # For the jco-browser conformance target (it gates in CI —
        # GITHUB_ACTIONS enables it in conformance/driver-ct/justfile).
        # The driver prefers the runner image's system Chrome; the
        # Playwright Chromium below is the fallback that keeps the leg
        # working if the image stops shipping one. Same caching scheme as
        # the jco job's browser cache, keyed on the driver package's
        # lockfile (which pins playwright-core and with it the browser
        # builds).
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-conformance-${{ runner.os }}-${{ hashFiles('conformance/driver-ct/jco/package-lock.json') }}
          restore-keys: playwright-conformance-${{ runner.os }}-

      - name: Install Playwright Chromium
        # On a cache hit the install only verifies the browser is present;
        # --with-deps (an apt run) is needed only when it was actually
        # (re)downloaded.
        run: |
          cd conformance/driver-ct/jco
          npm ci --no-audit --no-fund
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright-core install chromium
          else
            npx playwright-core install --with-deps chromium
          fi

      - name: Run the conformance matrix
        run: just gha::conformance-checks
        env:
          CONFORMANCE_PREBUILT: ${{ steps.ct-artifacts.outputs.cache-hit == 'true' && '1' || '' }}

      - name: Save the conformance artifacts cache
        # An explicit step, not the cache action's post: post steps run in
        # reverse order, so a post-ordered save runs after rust-cache's
        # cleanup — which deletes workspace artifacts from target/ whenever
        # rust-cache saves (exactly the runs that rebuilt) — and finds the
        # paths gone, skipping the save with only a warning (run
        # 31429458405). always(): the artifacts' validity is keyed on the
        # build inputs, not on the run's verdict, so a failing run's build
        # still pays forward — the recipes verify each file on restore and
        # fall back to cargo, so a partial save (failed build) is safe.
        if: always() && steps.ct-artifacts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/wasm32-wasip2/release/conformance_guest_ct.wasm
            target/wasm32-wasip2/release/conformance_signing_guest_ct.wasm
            target/wasm32-wasip2/release/polymorph_webcrypto_guest_provider.wasm
            target/release/ct-driver
            target/release/compat
          key: conformance-artifacts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/**', 'wit/**', 'conformance/vectors/**', 'conformance/harness/**', 'conformance/guest-ct/Cargo.toml', 'conformance/guest-ct/build.rs', 'conformance/guest-ct/src/**', 'conformance/signing-guest-ct/Cargo.toml', 'conformance/signing-guest-ct/src/**', 'conformance/class-d/**', 'conformance/driver-ct/Cargo.toml', 'conformance/driver-ct/src/**') }}

      - name: Upload the ubuntu conformance results
        # Interim: conformance-aggregate merges these with the macOS
        # jco-webkit results and publishes the full conformance-results
        # artifact (the Pages viewer's and the matrix-refresh flow's
        # input).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-ubuntu
          path: |
            conformance/driver-ct/results/*.jsonl
            conformance/driver-ct/results/*.meta.json
          retention-days: 7
          if-no-files-found: ignore

  # The transpiled suites for the engine-leg jobs: conformance-firefox and
  # conformance-webkit consume only conformance/driver-ct/jco/generated,
  # so it is produced here — the suite wasms from the conformance-artifacts
  # cache (on a miss, a build-suites cargo run; never the host-driver
  # link, which only the conformance job needs) plus the jco transpile —
  # and the engine legs start as soon as this finishes (~1 minute warm)
  # instead of waiting for the full conformance matrix.
  conformance-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore conformance artifacts
        # Restore-only, the conformance job's key (that job owns the
        # save; the path list must match it verbatim — the list is part
        # of the cache's version): a hit provides the suite wasms, a miss
        # builds just the two suite crates below.
        id: ct-artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            target/wasm32-wasip2/release/conformance_guest_ct.wasm
            target/wasm32-wasip2/release/conformance_signing_guest_ct.wasm
            target/wasm32-wasip2/release/polymorph_webcrypto_guest_provider.wasm
            target/release/ct-driver
            target/release/compat
          key: conformance-artifacts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/**', 'wit/**', 'conformance/vectors/**', 'conformance/harness/**', 'conformance/guest-ct/Cargo.toml', 'conformance/guest-ct/build.rs', 'conformance/guest-ct/src/**', 'conformance/signing-guest-ct/Cargo.toml', 'conformance/signing-guest-ct/src/**', 'conformance/class-d/**', 'conformance/driver-ct/Cargo.toml', 'conformance/driver-ct/src/**') }}

      - name: Install Rust toolchain
        if: steps.ct-artifacts.outputs.cache-hit != 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        if: steps.ct-artifacts.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          cache-all-crates: true
          save-if: false

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap (its prebuilt path needs
        # no Rust toolchain; the compile fallback is disabled rather than
        # assumed absent).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and transpile the suites
        run: just gha::conformance-suites
        env:
          CONFORMANCE_PREBUILT: ${{ steps.ct-artifacts.outputs.cache-hit == 'true' && '1' || '' }}

      - name: Upload the transpiled suites
        uses: actions/upload-artifact@v4
        with:
          name: conformance-suites
          path: conformance/driver-ct/jco/generated
          retention-days: 7

  # The jco-firefox conformance leg runs as its own job: even with the
  # reuse worker (one component instance per shard — see
  # conformance/driver-ct/jco/reuse-worker.mjs) Firefox paces the suites
  # slower than Chromium, and a runner to itself keeps the conformance
  # job's budget engine-independent. The transpiled suites are built in
  # the conformance-suites job and handed over; case failures do not fail
  # this job — conformance-aggregate assesses them against the declared
  # expected-fail ledger (#356).
  conformance-firefox:
    needs: conformance-suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap (its prebuilt path needs
        # no Rust toolchain; the compile fallback is disabled rather than
        # assumed absent).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download the transpiled suites
        uses: actions/download-artifact@v4
        with:
          name: conformance-suites
          path: conformance/driver-ct/jco/generated

      - name: Cache Playwright Firefox
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-conformance-firefox-${{ runner.os }}-${{ hashFiles('conformance/driver-ct/jco/package-lock.json') }}
          restore-keys: playwright-conformance-firefox-${{ runner.os }}-

      - name: Install the driver package + Playwright Firefox
        run: |
          cd conformance/driver-ct/jco
          npm ci --no-audit --no-fund
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright-core install firefox
          else
            npx playwright-core install --with-deps firefox
          fi

      - name: Run the jco-firefox conformance leg
        run: just conformance-ct::run-firefox

      - name: Upload the jco-firefox results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-firefox
          path: |
            conformance/driver-ct/results/jco-firefox*.jsonl
            conformance/driver-ct/results/jco-firefox.meta.json
          retention-days: 7
          if-no-files-found: ignore

  # The jco-webkit conformance leg runs on macOS: Playwright's WebKit
  # there uses Apple's crypto backend — the closest CI proxy for Safari —
  # where the Linux port's backend serves less and represents no shipping
  # Safari (run-browser.mjs refuses it off darwin). The transpiled suites
  # are built on ubuntu (the conformance-suites job) and handed over; case
  # failures do not fail this job — conformance-aggregate assesses them
  # against the declared expected-fail ledger.
  conformance-webkit:
    needs: conformance-suites
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap (its prebuilt path needs
        # no Rust toolchain; the compile fallback is disabled rather than
        # assumed absent).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download the transpiled suites
        uses: actions/download-artifact@v4
        with:
          name: conformance-suites
          path: conformance/driver-ct/jco/generated

      - name: Cache Playwright WebKit
        # Same scheme as the jco job's browser cache (macOS cache path).
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-conformance-${{ runner.os }}-${{ hashFiles('conformance/driver-ct/jco/package-lock.json') }}
          restore-keys: playwright-conformance-${{ runner.os }}-

      - name: Install the driver package + Playwright WebKit
        run: |
          cd conformance/driver-ct/jco
          npm ci --no-audit --no-fund
          npx playwright-core install webkit

      - name: Run the jco-webkit conformance leg
        run: just conformance-ct::run-webkit

      - name: Upload the jco-webkit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results-webkit
          path: |
            conformance/driver-ct/results/jco-webkit*.jsonl
            conformance/driver-ct/results/jco-webkit.meta.json
          retention-days: 7
          if-no-files-found: ignore

  # Every target's results in one place: the full aggregates, the
  # committed-matrix check, and the compat matrix (build + --require-all
  # check) run here, then the merged conformance-results artifact is
  # published — the Pages viewer's and the no-Chrome matrix-refresh
  # flow's input (#306).
  conformance-aggregate:
    needs: [conformance, conformance-firefox, conformance-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Restore conformance artifacts
        # The same key the conformance job populated in this run: a hit
        # provides the prebuilt compat binary (CONFORMANCE_PREBUILT
        # below); the miss path rebuilds via the recipes' `build`
        # dependency. Restored first so the hit path — the norm, since
        # the conformance job saved this key minutes earlier — skips the
        # Rust toolchain and cargo-cache steps below entirely: this job
        # ends the critical path, and the toolchain only serves the miss
        # path's rebuild.
        id: ct-artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            target/wasm32-wasip2/release/conformance_guest_ct.wasm
            target/wasm32-wasip2/release/conformance_signing_guest_ct.wasm
            target/wasm32-wasip2/release/polymorph_webcrypto_guest_provider.wasm
            target/release/ct-driver
            target/release/compat
          key: conformance-artifacts-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'rust/**', 'wit/**', 'conformance/vectors/**', 'conformance/harness/**', 'conformance/guest-ct/Cargo.toml', 'conformance/guest-ct/build.rs', 'conformance/guest-ct/src/**', 'conformance/signing-guest-ct/Cargo.toml', 'conformance/signing-guest-ct/src/**', 'conformance/class-d/**', 'conformance/driver-ct/Cargo.toml', 'conformance/driver-ct/src/**') }}

      - name: Install Rust toolchain
        if: steps.ct-artifacts.outputs.cache-hit != 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        if: steps.ct-artifacts.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: conformance
          cache-all-crates: true
          save-if: false

      - name: Install the component-test tools at the pinned revision
        uses: polymorph-components/polymorph-test/actions/setup@b4444a25a22106ad4128549bdc9e579552e62210

      - name: Download the ubuntu conformance results
        uses: actions/download-artifact@v4
        with:
          name: conformance-results-ubuntu
          path: conformance/driver-ct/results

      - name: Download the jco-firefox results
        uses: actions/download-artifact@v4
        with:
          name: conformance-results-firefox
          path: conformance/driver-ct/results

      - name: Download the jco-webkit results
        uses: actions/download-artifact@v4
        with:
          name: conformance-results-webkit
          path: conformance/driver-ct/results

      - name: Run the aggregate checks
        run: just gha::conformance-aggregate-checks
        env:
          CONFORMANCE_PREBUILT: ${{ steps.ct-artifacts.outputs.cache-hit == 'true' && '1' || '' }}

      # Presentation, not verdict: the just gate above already ran and
      # gated the same aggregates; these re-run them through
      # component-test's composite action for the job summary and
      # finding annotations, with the prebuilt CLI so aggregation
      # semantics cannot skew from the pin. The action's cargo-lock
      # input polices the `uses:` refs against the pin.
      - name: Publish the conformance matrix
        if: always() && hashFiles('conformance/driver-ct/results/*.jsonl') != ''
        uses: polymorph-components/polymorph-test/actions/aggregate@b4444a25a22106ad4128549bdc9e579552e62210
        with:
          lock: conformance/guest-ct/tests.lock
          manifest: conformance/driver-ct/targets.toml
          results: |
            wasmtime-rustcrypto=conformance/driver-ct/results/wasmtime-rustcrypto.jsonl
            composed=conformance/driver-ct/results/composed.jsonl
            jco-node=conformance/driver-ct/results/jco-node.jsonl
            jco-browser=conformance/driver-ct/results/jco-browser.jsonl
            deltic-browser=conformance/driver-ct/results/deltic-browser.jsonl
            jco-firefox=conformance/driver-ct/results/jco-firefox.jsonl
            jco-webkit=conformance/driver-ct/results/jco-webkit.jsonl
            deltic-deno=conformance/driver-ct/results/deltic-deno.jsonl
          summary-title: Conformance matrix
          cli: target/ct-tools/bin/component-test
          cargo-lock: Cargo.lock

      - name: Publish the signing conformance matrix
        if: always() && hashFiles('conformance/driver-ct/results/*.jsonl') != ''
        uses: polymorph-components/polymorph-test/actions/aggregate@b4444a25a22106ad4128549bdc9e579552e62210
        with:
          lock: conformance/signing-guest-ct/tests.lock
          manifest: conformance/driver-ct/targets-signing.toml
          results: |
            wasmtime-rustcrypto=conformance/driver-ct/results/wasmtime-signing.jsonl
            jco-node=conformance/driver-ct/results/jco-node-signing.jsonl
            jco-browser=conformance/driver-ct/results/jco-browser-signing.jsonl
            deltic-browser=conformance/driver-ct/results/deltic-browser-signing.jsonl
            jco-firefox=conformance/driver-ct/results/jco-firefox-signing.jsonl
            jco-webkit=conformance/driver-ct/results/jco-webkit-signing.jsonl
            deltic-deno=conformance/driver-ct/results/deltic-deno-signing.jsonl
          summary-title: Signing conformance matrix
          cli: target/ct-tools/bin/component-test
          cargo-lock: Cargo.lock

      - name: Upload the conformance results
        # Feeds the Pages viewer + compat page (the latest main run's
        # results pane) and the no-Chrome matrix-regeneration path (#306).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance/driver-ct/results/*.jsonl
            conformance/driver-ct/results/*.meta.json
            conformance/driver-ct/results/matrix.md
            conformance/driver-ct/results/matrix-signing.md
            conformance/driver-ct/results/compat.json
          retention-days: 30
          if-no-files-found: ignore

  # The webcrypto-componentize JS guest library's gates: the composed demo
  # (the JS guest's checks against the in-guest provider, including the
  # extension-error transport the WPT suites cannot observe) and the WPT
  # WebCryptoAPI suites. Both componentize from the tree with the pinned
  # componentize-js (downloaded — see the componentize-js-toolchain
  # workflow), compose with a freshly built in-guest provider and driver,
  # and run under wasmtime. Componentizing takes seconds, so the guests are
  # always built from the tree under test.
  componentize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: componentize
          cache-all-crates: true

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKIP_NODE: "1"

      - name: Run the componentize checks
        run: just gha::componentize-checks

  # Guest component build + jco (Web Crypto) host test. jco's async ABI uses
  # JSPI, which Node exposes behind --experimental-wasm-jspi from 24 on.
  jco:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: jco
          cache-all-crates: true

      - name: Install dependencies
        run: ./scripts/setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Cache Playwright browsers
        # The browser downloads dominate the install step (~35s); the cache
        # key follows the parity package's lockfile, which pins
        # playwright-core and with it the browser builds. restore-keys lets
        # a lockfile bump start from the previous browsers and download
        # only what changed.
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('js/componentize/wpt/parity/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        # The browser WPT parity gates' engines: Playwright's pinned builds
        # (Firefox launched with Gecko's JSPI pref; Chromium ships JSPI), so
        # the loss sets in losses-firefox.js and losses-chromium.js measure
        # one engine each, everywhere. On a cache hit the install only
        # verifies the browsers are present; --with-deps (an apt run) is
        # needed only when the browsers were actually (re)downloaded.
        run: |
          cd js/componentize/wpt/parity
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright-core install firefox chromium
          else
            npx playwright-core install --with-deps firefox chromium
          fi

      - name: Run the jco host checks
        run: just gha::jco-checks

  # The WebKit WPT parity gate runs on macOS: Playwright's WebKit there
  # uses Apple's crypto backend — the closest CI proxy for mobile Safari —
  # where the Linux port (libgcrypt) serves less and crashes under this
  # workload. No componentize-js toolchain is published for darwin, so the
  # page artifacts are built on ubuntu and handed over.
  wpt-parity-webkit-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5


      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap (its prebuilt path needs
        # no Rust toolchain; the compile fallback is disabled rather than
        # assumed absent).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the parity package's dependencies
        run: cd js/componentize/wpt/parity && npm ci --no-audit --no-fund

      - name: Build the parity page artifacts
        run: just wpt::web-artifacts

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpt-web-artifacts
          path: |
            js/componentize/wpt/parity/generated-web/**
            js/componentize/wpt/build/group-*.js
            js/componentize/wpt/web/preview2-shim/**

  wpt-parity-webkit:
    needs: wpt-parity-webkit-artifacts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5


      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Install just
        # The same pin as scripts/setup.sh, installed by the same
        # digest-pinned cargo-binstall bootstrap (its prebuilt path needs
        # no Rust toolchain; the compile fallback is disabled rather than
        # assumed absent).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install-binstall.sh
          export PATH="$HOME/.cargo/bin:$PATH"
          mkdir -p "$HOME/.local/bin"
          cargo-binstall --no-confirm --disable-strategies compile \
            --install-path "$HOME/.local/bin" just@1.54.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download the parity page artifacts
        uses: actions/download-artifact@v4
        with:
          name: wpt-web-artifacts
          path: js/componentize/wpt

      - name: Cache Playwright WebKit
        # Same scheme as the jco job's browser cache (macOS cache path).
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('js/componentize/wpt/parity/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install the parity package + Playwright WebKit
        run: |
          cd js/componentize/wpt/parity
          npm ci --no-audit --no-fund
          npx playwright-core install webkit

      - name: Run the WebKit WPT parity gate
        run: just wpt::parity-webkit

      - name: Record the proposed ratchet
        # On a gate failure, re-run the comparator in update mode: the step
        # summary carries the reviewable losses-webkit.js diff and the
        # artifact below carries the rewritten file, so a re-record needs
        # no local run (commit the file, or use
        # `just gha::update-webkit-losses-from-ci` on the records artifact).
        if: failure()
        run: |
          if [ ! -f js/componentize/wpt/build/parity-baseline-webkit.json ]; then
            echo "no parity records: the failure predates the parity run" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node js/componentize/wpt/parity/compare.mjs \
            js/componentize/wpt/build/parity-baseline-webkit.json \
            js/componentize/wpt/build/parity-roundtrip-webkit.json \
            --losses losses-webkit.js --update
          {
            echo '## Proposed `losses-webkit.js`'
            echo '```diff'
            git diff -- js/componentize/wpt/parity/losses-webkit.js
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the proposed ratchet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-parity-webkit-proposed-ratchet
          path: js/componentize/wpt/parity/losses-webkit.js
          if-no-files-found: ignore

      - name: Upload the WebKit parity records
        # The comparator's inputs, kept whether the gate passes or fails:
        # losses-webkit.js is recorded from a macOS run, and this artifact
        # is how a Linux-bound change re-records it
        # (`just gha::update-webkit-losses-from-ci`).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpt-parity-webkit-records
          path: |
            js/componentize/wpt/build/parity-baseline-webkit.json
            js/componentize/wpt/build/parity-roundtrip-webkit.json
