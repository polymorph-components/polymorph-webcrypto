# The compat matrix's curated structure: display order, row/group
# labels, case ownership, and the NAMES of divergences (aspects). Which
# cells are green is always computed from results — see README.md in
# this directory for the schema and the fail-closed validation the
# `compat` binary applies (total ownership, per-cell uniformity, aspect
# liveness, ledger agreement).
version = "0.1"

# ── Columns ──────────────────────────────────────────────────────────
# The platform-backed hosts first, engine-major, then the two Rust
# implementations of this repository. Chromium is one column serving
# both host stacks: deltic (the primary JS path) carries the results,
# and the jco arm folds in under the builder's cell-equality gate — a
# divergence between the stacks on the same platform fails the build,
# splitting the columns again.

[[columns]]
target = "deltic-browser"
label = "Chromium"
kind = "host"
merges = "jco-browser"

[[columns]]
target = "jco-firefox"
label = "Firefox"
kind = "host"

[[columns]]
target = "jco-webkit"
label = "WebKit (macOS)"
kind = "host"

[[columns]]
target = "jco-node"
label = "Node.js"
kind = "host"

[[columns]]
target = "deltic-deno"
label = "Deno"
kind = "host"

[[columns]]
target = "wasmtime-rustcrypto"
label = "Wasmtime (RustCrypto)"
kind = "implementation"

[[columns]]
target = "composed"
label = "In-guest provider"
kind = "implementation"

