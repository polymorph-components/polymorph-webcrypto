[[rows.aspects]]
id = "malformed-wraps"
label = "Malformed CBC wraps rejected at unwrap"
note = """
Unwrapping over AES-CBC decrypts and unpads the wrapped bytes before
minting a key, so a malformed wrap must fail like any malformed ciphertext.
WebKit's CBC decrypt accepts inputs the padding rules reject (see the
AES-CBC note), so a malformed CBC wrap unwraps into a key.
"""
select = ["shared:probe/cipher-wrap-uniform-failure"]

