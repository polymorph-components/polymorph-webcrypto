# ── Excluded cases ───────────────────────────────────────────────────
# Decline cases (`!feature`) prove a refusal on targets missing the
# feature; the rows' positive cases already render the absence, and the
# aggregate polices the declines themselves.

[[excluded]]
select = ["shared:sha1-checked/decline/"]
why = "the sha1-checked row's positive probe renders the hosts' absence"

[[excluded]]
select = ["shared:rsa-verify-8192/decline/"]
why = "the rsassa-pkcs1-v15-verify row's 8192-bit aspect renders the absence"

[[excluded]]
select = ["signing:rsa-sign/decline/", "signing:probe/rsa-sign-declined"]
why = "the gated sign rows' positive cases render the browsers' fail-closed posture"

[[excluded]]
select = ["signing:rsa-oaep-decrypt/decline/", "signing:probe/rsa-oaep-declined"]
why = "the rsa-oaep-decrypt row's positive cases render the browsers' fail-closed posture"

# ── Structural absences ──────────────────────────────────────────────
# The signing suite's world imports interfaces the in-guest provider
# never exports (class D — rust/guest-provider/README.md), so `composed`
# is not a signing-suite target at all: `wac plug` refuses the
# composition (the class-d gate asserts exactly that).

[[structural]]
target = "composed"
row = "ecdsa-sign"
note = "class D: the provider never exports ecdsa-sign; the composition fails at wac plug time"

[[structural]]
target = "composed"
row = "rsassa-pkcs1-v15-sign"
note = "class D: the provider never exports rsassa-pkcs1-v15-sign"

[[structural]]
target = "composed"
row = "rsa-pss-sign"
note = "class D: the provider never exports rsa-pss-sign"

[[structural]]
target = "composed"
row = "rsa-oaep-encrypt"
note = "class D: the provider never exports rsa-oaep-encrypt"

[[structural]]
target = "composed"
row = "rsa-oaep-decrypt"
note = "class D: the provider never exports rsa-oaep-decrypt"

[[structural]]
target = "composed"
row = "rsa-sign-family"
note = "class D: the signing suite cannot compose with the provider"
